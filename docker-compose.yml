version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./astrixcore.db
      - DATABASE_SYNC_URL=sqlite:///./astrixcore.db
      - LLM_PROVIDER=mock
      - LLM_API_KEY=
      - LLM_MODEL=gpt-4o
      - DEBUG=true
      - SECRET_KEY=change-me-in-production-use-openssl-rand-hex-32
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173"]
    volumes:
      - ./storage:/app/storage
      - ./examples:/app/examples
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  storage_data: